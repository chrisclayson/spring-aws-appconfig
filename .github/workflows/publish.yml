name: Publish to Maven Central

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish (defaults to <base>-<run-number>)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: maven-central-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test and publish both artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Resolve release version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-}"
          version="${version#v}"
          if [ -z "$version" ]; then
            base="$(sed -n 's/^version=\(.*\)-SNAPSHOT$/\1/p' gradle.properties)"
            if [ -z "$base" ]; then
              echo "::error::Could not derive a base version from gradle.properties"
              exit 1
            fi
            version="${base}-${GITHUB_RUN_NUMBER}"
          fi
          case "$version" in
            *-SNAPSHOT)
              echo "::error::Maven Central releases must not use -SNAPSHOT: $version"
              exit 1
              ;;
          esac
          echo "Publishing version: $version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build and test
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: ./gradlew clean build -Pversion="$VERSION" --no-daemon --stacktrace

      - name: Run AppConfig integration test (AWS Emulator)
        env:
          APPCONFIG_IT_MODE: emulator
          VERSION: ${{ steps.version.outputs.value }}
        run: ./gradlew :example:integrationTest -Pversion="$VERSION" --no-daemon --stacktrace

      - name: Publish both artifacts to Maven Central
        env:
          VERSION: ${{ steps.version.outputs.value }}
          ORG_GRADLE_PROJECT_centralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_centralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: ./gradlew publishAggregationToCentralPortal -Pversion="$VERSION" --no-daemon --stacktrace
